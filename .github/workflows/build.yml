name: Build, test & publish beta
# The run's title says what is being built: the commit message on a push, or the "what" input
# (else the branch) on a manual run.
run-name: ${{ inputs.what || github.event.head_commit.message || format('Beta build from {0}', github.ref_name) }}

# Every push to main (and every upstream sync) builds stable + beta APKs, runs the emulator
# smoke test, and publishes to the BETA channel only. Stable users are untouched until someone
# runs "Promote beta to stable".
on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'docs/**' ]
  workflow_dispatch:
    inputs:
      what:
        description: "What's being tested (shown as the run title)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Compiles upstream SmartTube + the HackerTube overlay. This job runs third-party build code
  # (SmartTube's Gradle scripts and plugins), so it gets no secrets and a read-only token, and it
  # produces UNSIGNED APKs. Signing happens in the separate "sign" job below, which never runs
  # upstream code, so a compromised upstream commit can't read the signing key.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      name: ${{ steps.ver.outputs.name }}
      code: ${{ steps.ver.outputs.code }}
    env:
      REPO_URL: https://github.com/${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0   # full history, for the list of changes since stable
          persist-credentials: false   # keep the token out of .git/config, where build code could read it
      - name: What's in this build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Newest promoted release (v<version>, not a pre-release). The rolling "latest"/"beta" tags don't count.
          STABLE=$(gh api "repos/${{ github.repository }}/releases?per_page=50" \
            --jq '[.[] | select(.prerelease == false and (.tag_name | startswith("v")))][0].tag_name // empty' 2>/dev/null || true)
          mkdir -p dist
          {
            echo "### What's in this build"
            echo ""
            echo "Branch \`${{ github.ref_name }}\` at \`$(git rev-parse --short HEAD)\`."
            if [ -n "$STABLE" ] && git rev-parse -q --verify "refs/tags/$STABLE" >/dev/null; then
              echo "Changes since the current stable release ($STABLE):"
              echo ""
              git log --no-merges --format='- %s' "$STABLE..HEAD" | head -30
            else
              echo "Latest change:"
              echo ""
              git log -1 --format='- %s'
            fi
            echo ""
            echo "### What gets tested"
            echo ""
            echo "- **Build:** stable and beta APKs compile and are signed with the HackerTube key."
            echo "- **Emulator test (Android TV):** the app installs, HackerTube rows load from hackertube.org, a video opens, Up next loads, rows page in while scrolling, and the app doesn't crash."
            echo "- **VirusTotal:** every APK is scanned before the beta is published."
            echo "- **Beta:** published only if all of the above pass. Stable is untouched until Promote beta to stable."
          } > dist/changes.md
          cat dist/changes.md >> "$GITHUB_STEP_SUMMARY"
          git log --no-merges --format='%s' "${STABLE:-HEAD~1}..HEAD" 2>/dev/null | head -10 | while read -r l; do echo "::notice title=In this build::$l"; done || true


      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare source (upstream SmartTube + HackerTube overlay)
        run: scripts/prepare.sh "$GITHUB_WORKSPACE/build/SmartTube"

      # SmartTube's gradle-wrapper.jar doesn't match any official Gradle release, so it isn't run.
      # Instead, the official Gradle distribution of the same version is downloaded (checksum-verified).
      - name: Read the Gradle version SmartTube uses
        id: gradle
        run: |
          V=$(sed -n 's#.*gradle-\([0-9.]*\)-\(bin\|all\)\.zip.*#\1#p' build/SmartTube/gradle/wrapper/gradle-wrapper.properties)
          [[ "$V" =~ ^[0-9]+(\.[0-9]+)+$ ]] || { echo "::error::Couldn't read the Gradle version"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Gradle $V"

      - name: Set up official Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}
          cache-disabled: true   # nothing from an upstream build carries over to the next one
          validate-wrappers: false   # the wrapper isn't used; it's deleted below

      - name: Remove SmartTube's wrapper jars
        run: find build/SmartTube -path '*/gradle/wrapper/gradle-wrapper.jar' -print -delete

      - name: Set version
        id: ver
        working-directory: build/SmartTube
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          BASE=$(grep -m1 'versionName' smarttubetv/build.gradle | awk -F'"' '{print $2}')
          CODE=$((3000000 + RUN_NUMBER))
          NAME="${BASE}-ht.${RUN_NUMBER}"
          sed -i "0,/versionCode [0-9]*/s//versionCode ${CODE}/" smarttubetv/build.gradle
          sed -i "0,/versionName \"[^\"]*\"/s//versionName \"${NAME}\"/" smarttubetv/build.gradle
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Building HackerTube TV $NAME ($CODE)"

      - name: Build stable + beta (unsigned)
        working-directory: build/SmartTube
        run: |
          rm -f keystore.properties   # no keystore.properties -> Gradle leaves release APKs unsigned
          set +e
          gradle --no-daemon --stacktrace assembleSthackertubeRelease assembleSthackertubebetaRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            ERR=$( (grep -n -E "^e: |error:|What went wrong|FAILED|Could not|> " "$RUNNER_TEMP/gradle.log" | head -40; echo '-----'; tail -60 "$RUNNER_TEMP/gradle.log") | cut -c1-300 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle build failed::${ERR}"
          fi
          exit $rc

      - name: Collect unsigned APKs
        run: |
          set -e
          OUTS=build/SmartTube/smarttubetv/build/outputs/apk
          mkdir -p unsigned/stable unsigned/beta
          cp "$OUTS"/sthackertube/release/*.apk unsigned/stable/
          cp "$OUTS"/sthackertubebeta/release/*.apk unsigned/beta/
          cp dist/changes.md unsigned/
          ls -la unsigned/*

      - name: Upload unsigned build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned
          path: unsigned/
          retention-days: 3

  # Signs the APKs with the HackerTube key. Only this job sees the signing secrets, and it runs
  # nothing from upstream SmartTube: just zipalign/apksigner from the runner's Android SDK.
  # The secrets can live in the "release" environment (Settings > Environments) so no other job
  # or workflow can reach them.
  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write      # build provenance
      attestations: write  # build provenance
    env:
      REPO_URL: https://github.com/${{ github.repository }}
      NAME: ${{ needs.build.outputs.name }}
      CODE: ${{ needs.build.outputs.code }}
      EXPECTED_CERT_SHA256: 41efc68f22d052bbcaa5a8075c27725b3b4d3a1302bb8a83d05442fceaf799b9
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download unsigned build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned
          path: unsigned

      - name: Check signing secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for s in SIGNING_KEY KEY_STORE_PASSWORD ALIAS KEY_PASSWORD; do [ -n "${!s}" ] || missing="$missing $s"; done
          if [ -n "$missing" ]; then
            echo "::error title=Signing secrets missing::Add these secrets (Settings > Environments > release, or repository secrets):$missing"
            exit 1
          fi

      - name: Sign APKs
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KS_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Using $(basename "$BT") build tools"
          KS="$RUNNER_TEMP/key.jks"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$KS"
          trap 'rm -f "$KS"' EXIT
          mkdir -p dist/stable dist/beta
          sign() { # source-dir abi-regex output
            local src
            src=$(ls "$1"/*.apk | grep -E "$2" || true)
            [ -n "$src" ] && [ "$(echo "$src" | wc -l)" = 1 ] || { echo "::error::Expected one APK matching $2 in $1, got: $src"; exit 1; }
            "$BT/zipalign" -f -p 4 "$src" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$KS" --ks-pass env:KS_PASS --ks-key-alias "$ALIAS" --key-pass env:KEY_PASS \
              --out "$3" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify "$3"
            rm -f "$RUNNER_TEMP/aligned.apk" "$3.idsig"
            echo "signed $3"
          }
          sign unsigned/stable '_armeabi-v7a[.-]' dist/stable/HackerTube.apk
          sign unsigned/stable '_arm64-v8a[.-]'   dist/stable/HackerTube_arm64-v8a.apk
          sign unsigned/stable '_universal[.-]'   dist/stable/HackerTube_universal.apk
          sign unsigned/stable '_x86_64[.-]'      dist/stable/HackerTube_x86_64.apk
          sign unsigned/stable '_x86[.-]'         dist/stable/HackerTube_x86-emulator.apk
          sign unsigned/beta   '_armeabi-v7a[.-]' dist/beta/HackerTube-Beta.apk
          sign unsigned/beta   '_arm64-v8a[.-]'   dist/beta/HackerTube-Beta_arm64-v8a.apk
          sign unsigned/beta   '_universal[.-]'   dist/beta/HackerTube-Beta_universal.apk
          cp unsigned/changes.md dist/

      - name: Update manifests and checksums
        run: |
          set -e
          manifest() { # channel-tag prefix file
            local DL="$REPO_URL/releases/download/$1" P="$2"
            cat <<JSON
          {
            "package": {
              "downloadUrl": "$DL/$P.apk",
              "downloadUrlList": ["$DL/$P.apk", "$DL/${P}_universal.apk"],
              "downloadUrlList_armeabi-v7a": ["$DL/$P.apk", "$DL/${P}_universal.apk"],
              "downloadUrlList_arm64-v8a": ["$DL/${P}_arm64-v8a.apk", "$DL/${P}_universal.apk"],
              "downloadUrlList_x86": ["$DL/${P}_universal.apk"],
              "downloadUrlList_x86_64": ["$DL/${P}_universal.apk"]
            },
            "$NAME": {
              "versionCode": $CODE,
              "changelog": ["HackerTube TV $NAME (SmartTube $(cut -c1-7 UPSTREAM_COMMIT))"]
            }
          }
          JSON
          }
          manifest latest HackerTube      > dist/stable/hackertube_tv.json
          manifest beta   HackerTube-Beta > dist/beta/hackertube_tv_beta.json
          python3 -m json.tool dist/stable/hackertube_tv.json > /dev/null
          python3 -m json.tool dist/beta/hackertube_tv_beta.json > /dev/null
          (cd dist/stable && sha256sum *.apk > SHA256SUMS.txt)
          (cd dist/beta && sha256sum *.apk > SHA256SUMS-beta.txt)

          # Privacy check: the signing certificate must not carry anything beyond the project name
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SUBJ=$("$BT/apksigner" verify --print-certs dist/stable/HackerTube.apk | grep -m1 "certificate DN:" | sed 's/.*certificate DN: //')
          echo "Signing certificate: $SUBJ"
          if [ "$SUBJ" != "CN=HackerTube TV" ]; then
            echo "::error title=Unexpected signing certificate::$SUBJ"; exit 1
          fi
          # And it must be the published HackerTube key (README > Security), so a swapped secret can't ship
          FP=$("$BT/apksigner" verify --print-certs dist/stable/HackerTube.apk | grep -m1 "certificate SHA-256 digest:" | awk '{print $NF}')
          if [ "$FP" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error title=Unexpected signing key::certificate SHA-256 $FP, expected $EXPECTED_CERT_SHA256"; exit 1
          fi
          ls -la dist/*

      - name: Build provenance (signed record that this workflow built these APKs)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/stable/*.apk
            dist/beta/*.apk

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 30

  smoke-test:
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke test on Android TV emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tests/smoke-test.sh dist/stable/HackerTube_x86-emulator.apk smoke

      - name: Test summary
        if: always()
        run: |
          if [ -f smoke/summary.md ]; then
            cat smoke/summary.md >> "$GITHUB_STEP_SUMMARY"
            # Also as annotations, which are readable from the API without signing in
            grep -E "^- |Result" smoke/summary.md | sed 's/^- //' | while read -r line; do echo "::notice title=Smoke test::$line"; done
            grep -E "^up next|related" smoke/hackertube-log.txt 2>/dev/null | head -5 | while read -r line; do echo "::notice title=Smoke log::$line"; done || true
          else
            echo "No summary (emulator did not start)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test screenshots and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-test
          path: smoke/
          retention-days: 30

  publish-beta:
    needs: [ build, sign, smoke-test ]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the releases
    env:
      HAS_VT_KEY: ${{ secrets.VIRUS_TOTAL_API_KEY != '' }}
      GH_TOKEN: ${{ github.token }}
      NAME: ${{ needs.build.outputs.name }}
      REPO_URL: https://github.com/${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: Remove releases signed with the retired key
        run: |
          [ -f .github/retired-releases.txt ] || exit 0
          grep -v '^\s*#' .github/retired-releases.txt | awk '{print $1}' | while read -r tag; do
            [ -n "$tag" ] || continue
            if [ "$tag" = "latest" ]; then
              # Only the old stable (versionCode <= 3000005) was signed with the retired key; never delete a promoted build
              gh release download latest -p hackertube_tv.json -O old.json 2>/dev/null || continue
              CODE=$(python3 -c "import json;d=json.load(open('old.json'));print(max(v['versionCode'] for k,v in d.items() if k!='package'))")
              [ "$CODE" -le 3000005 ] || continue
            fi
            gh release delete "$tag" --cleanup-tag -y 2>/dev/null && echo "deleted $tag" || true
          done

      - name: Upload to VirusTotal
        if: env.HAS_VT_KEY == 'true'
        continue-on-error: true
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        with:
          vt_api_key: ${{ secrets.VIRUS_TOTAL_API_KEY }}
          files: |
            dist/stable/HackerTube.apk
            dist/beta/HackerTube-Beta.apk
          request_rate: 4

      - name: Collect VirusTotal results
        if: env.HAS_VT_KEY == 'true'
        continue-on-error: true
        env:
          VT_KEY: ${{ secrets.VIRUS_TOTAL_API_KEY }}
        run: |
          {
            echo "### VirusTotal"
            for f in dist/stable/HackerTube.apk dist/beta/HackerTube-Beta.apk; do
              sha=$(sha256sum "$f" | cut -d' ' -f1)
              stats=""
              for i in $(seq 1 30); do   # analysis takes a few minutes
                stats=$(curl -s -H "x-apikey: $VT_KEY" "https://www.virustotal.com/api/v3/files/$sha" | python3 -c "import json,sys;s=json.load(sys.stdin)['data']['attributes'].get('last_analysis_stats',{});t=sum(s.values());print(s.get('malicious',0),s.get('suspicious',0),t) if t>0 else exit(1)" 2>/dev/null) && break
                sleep 15
              done
              if [ -n "$stats" ]; then
                read -r mal sus tot <<< "$stats"
                echo "- \`$(basename "$f")\`: $mal/$tot engines flagged as malicious, $sus as suspicious. [Report](https://www.virustotal.com/gui/file/$sha)"
                [ "$mal" -ge 4 ] && echo "::warning title=VirusTotal::$(basename "$f") flagged by $mal engines" >&2
              else
                echo "- \`$(basename "$f")\`: scan still running. [Report](https://www.virustotal.com/gui/file/$sha)"
              fi
            done
          } > dist/virustotal.md
          cat dist/virustotal.md | tee -a "$GITHUB_STEP_SUMMARY"
          sed -n 's/^- //p' dist/virustotal.md | while read -r l; do echo "::notice title=VirusTotal::$l"; done

      - name: Publish versioned pre-release
        run: |
          VT=""; [ -f dist/virustotal.md ] && VT="$(cat dist/virustotal.md)"
          CHANGES=""; [ -f dist/changes.md ] && CHANGES="$(cat dist/changes.md)"
          NOTES="Beta build $NAME (SmartTube $(cut -c1-7 UPSTREAM_COMMIT)). Passed the emulator smoke test.

          $CHANGES

          Not yet promoted to stable. Testers: install **HackerTube Beta** from $REPO_URL/releases/download/beta/HackerTube-Beta.apk

          $VT

          Verify an APK was built by this repo: \`gh attestation verify <file>.apk -R ${{ github.repository }}\`"
          EXTRA=""; [ -f dist/virustotal.md ] && EXTRA="dist/virustotal.md"
          gh release create "v$NAME" dist/stable/* dist/beta/* $EXTRA --title "HackerTube TV $NAME (beta)" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"

      - name: Update rolling beta channel
        run: |
          NOTES="Rolling beta channel. Current build: $NAME. Installs as **HackerTube Beta** next to the stable app.

          Downloader URL: $REPO_URL/releases/download/beta/HackerTube-Beta.apk"
          if gh release view beta > /dev/null 2>&1; then
            gh release upload beta dist/beta/* --clobber
            gh release edit beta --title "HackerTube Beta (current: $NAME)" --notes "$NOTES" --prerelease
          else
            gh release create beta dist/beta/* --title "HackerTube Beta (current: $NAME)" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
          echo "Beta $NAME published. Promote it with Actions > Promote beta to stable." >> "$GITHUB_STEP_SUMMARY"
